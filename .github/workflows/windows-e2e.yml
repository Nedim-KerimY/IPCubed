name: Windows end-to-end (real KiCad)

# Installs KiCad 10 on a Windows VM, installs the plugin like "Install from File", clicks 3D Live like a user and checks
# the overlay (tests/win_e2e.py). Does not publish anything. Screenshots and logs: the run's "win-e2e-*" artifacts.
on:
  push:
    branches: [ccr-e01b5649-is3y9q]
    paths: [.github/workflows/windows-e2e.yml, tests/win_e2e.py, plugins/**]
  workflow_dispatch:
    inputs:
      plugin_ref:
        description: Branch/commit of the plugin to test
        default: kicad-plugin
      kicad_version:
        description: KiCad version
        default: "10.0.6"

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 100% with Mesa and 100% without OpenGL passed/were analysed in run 38787035851; now the scaled displays
          - { scale: 100, gl: mesa, variant: minsize }   # bisect: Qt minimum size back while overlaid
          - { scale: 100, gl: mesa, variant: noloop }    # bisect: no closed-loop overlay correction
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PLUGIN_REF: ${{ github.event.inputs.plugin_ref || github.sha }}   # push: the plugin code of this commit
      KICAD_VERSION: ${{ github.event.inputs.kicad_version || '10.0.6' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PLUGIN_REF }}
          path: plugin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install KiCad
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          curl.exe -sSL -o kicad-setup.exe "https://github.com/KiCad/kicad-source-mirror/releases/download/$env:KICAD_VERSION/kicad-$env:KICAD_VERSION-x86_64.exe"
          (Get-Item kicad-setup.exe).Length / 1MB
          $p = Start-Process .\kicad-setup.exe -ArgumentList '/S', '/allusers' -PassThru -Wait
          "installer exit code: $($p.ExitCode)"
          # the NSIS installer can hand over to a child process: wait until no installer process is left and pcbnew exists
          $roots = "C:\Program Files\KiCad", "$env:LOCALAPPDATA\Programs\KiCad"
          for ($i = 0; $i -lt 180; $i++) {
            $exe = Get-ChildItem $roots -Recurse -Filter pcbnew.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            $busy = Get-Process | Where-Object { $_.Path -like "*kicad-setup*" -or $_.Name -like "Au_*" -or $_.Name -like "*nsis*" }
            if ($exe -and -not $busy) { break }
            Start-Sleep 5
          }
          if (-not $exe) { Get-Process | Sort-Object Name | Format-Table Name, Id, Path -AutoSize | Out-String -Width 250; throw "pcbnew.exe not found" }
          $kicad = Split-Path (Split-Path $exe.FullName)
          "KiCad: $kicad"
          "KICAD_DIR=$kicad" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Remove-Item kicad-setup.exe -ErrorAction SilentlyContinue
      - name: Software OpenGL for KiCad (Mesa llvmpipe; the VM has no GPU)
        if: matrix.gl == 'mesa'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = gh api repos/pal1000/mesa-dist-win/releases/latest | ConvertFrom-Json
          $asset = $rel.assets | Where-Object { $_.name -match 'release-msvc\.7z$' } | Select-Object -First 1
          "Mesa: $($asset.name)"
          curl.exe -sSL -o mesa.7z $asset.browser_download_url
          7z x mesa.7z -omesa -y | Out-Null
          foreach ($f in "opengl32.dll", "libgallium_wgl.dll", "libglapi.dll") {
            if (Test-Path "mesa\x64\$f") { Copy-Item "mesa\x64\$f" "$env:KICAD_DIR\bin\" -Force; "copied $f" }
          }
          "GALLIUM_DRIVER=llvmpipe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Bisect variant (temporary)
        if: matrix.variant
        shell: python
        run: |
          from pathlib import Path
          v = "${{ matrix.variant }}"
          if v == "minsize":
              p = Path("plugin/plugins/ipcubed/qt_shell.py"); s = p.read_text(encoding="utf-8")
              s = s.replace("self.embedder.prepare(self.frame)", "self.embedder.prepare(self.frame); self._window_min_size(True)", 1)
          else:
              p = Path("plugin/plugins/ipcubed/embed.py"); s = p.read_text(encoding="utf-8")
              s = s.replace("elif time.monotonic() - self._moved_at > 0.25:", "elif False:", 1)
          p.write_text(s, encoding="utf-8")
          print(v, "patched")
      - name: Build the plugin package
        run: python plugin/tools/build_pcm_zip.py dist
      - name: Driver dependencies
        run: python -m pip install --quiet numpy pillow psutil pywin32
      - name: Run the end-to-end test
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist\IPCubed-*-pcm.zip | Select-Object -First 1).FullName
          python driver\tests\win_e2e.py --kicad "$env:KICAD_DIR" --zip $zip --out e2e-out --scale ${{ matrix.scale }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win-e2e-${{ matrix.scale }}-${{ matrix.gl }}-${{ matrix.variant }}
          path: e2e-out
