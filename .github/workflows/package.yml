name: Package KiCad plugin

on:
  push:
    branches: [kicad-plugin]
  workflow_dispatch:
    inputs:
      make_latest:
        description: "Make this version the latest (default download for everyone)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # A fresh install must work for every user before anything is published: Windows with KiCad's Python (3.11),
  # Linux with the system Pythons KiCad 10 uses (Ubuntu 24.04: 3.12, Debian 13 / Fedora: 3.13+).
  smoke-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.11" }
          - { os: ubuntu-24.04, python: "3.11" }
          - { os: ubuntu-24.04, python: "3.12" }
          - { os: ubuntu-24.04, python: "3.13" }
          - { os: ubuntu-24.04, python: "3.14" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Linux libraries (Qt offscreen, software Vulkan for wgpu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 mesa-vulkan-drivers
      - name: Fresh environment, install with the plugin's installer, run checks
        shell: bash
        run: |
          python -m venv fresh
          if [ "$RUNNER_OS" = "Windows" ]; then PY=fresh/Scripts/python.exe; else PY=fresh/bin/python; fi
          $PY tests/smoke_test.py

  package:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build PCM zip
        id: build
        run: |
          python tools/build_pcm_zip.py dist
          cp dist/IPCubed-*-pcm.zip dist/IPCubed-pcm.zip   # sabit ad: README'deki releases/latest/download/IPCubed-pcm.zip
          echo "version=$(python -c "import json;print(json.load(open('metadata.json'))['versions'][0]['version'])")" >> "$GITHUB_OUTPUT"
      - name: Validate package (KiCad's official schemas, archive layout)
        run: |
          python -m pip install --quiet jsonschema
          for z in dist/*.zip; do python tools/validate_package.py "$z"; done
      - uses: actions/upload-artifact@v4
        with:
          name: IPCubed-pcm
          path: dist/*.zip
      - name: Publish release (latest build of this version)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.build.outputs.version }}
          MAKE_LATEST: ${{ github.event.inputs.make_latest || 'false' }}
        run: |
          # "latest" (releases/latest/download/IPCubed-pcm.zip, README link) changes ONLY when asked for (Run workflow >
          # make_latest). A new version is published as a pre-release for testers; rebuilding the version that is already
          # the latest keeps it the latest.
          CUR=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          if [ "$MAKE_LATEST" = "true" ] || [ "$TAG" = "$CUR" ]; then
            KIND="--latest"; TITLE="IPCubed $TAG (beta)"
          else
            KIND="--prerelease --latest=false"; TITLE="IPCubed $TAG (pre-release, testing)"
          fi
          echo "current latest: ${CUR:-none}; publishing $TAG with $KIND"
          gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" $KIND --title "$TITLE" \
            --notes "Install: KiCad > Plugin and Content Manager > Install from File... and pick IPCubed-pcm.zip (do not unzip it). Do not use GitHub's Code > Download ZIP. See the README."
