name: Package KiCad plugin

on:
  push:
    branches: [kicad-plugin]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build PCM zip
        id: build
        run: |
          python tools/build_pcm_zip.py dist
          cp dist/IPCubed-*-pcm.zip dist/IPCubed-pcm.zip   # sabit ad: README'deki releases/latest/download/IPCubed-pcm.zip
          echo "version=$(python -c "import json;print(json.load(open('metadata.json'))['versions'][0]['version'])")" >> "$GITHUB_OUTPUT"
      - name: Validate package (KiCad's official schemas, archive layout)
        run: |
          python -m pip install --quiet jsonschema
          for z in dist/*.zip; do python tools/validate_package.py "$z"; done
      - uses: actions/upload-artifact@v4
        with:
          name: IPCubed-pcm
          path: dist/*.zip
      - name: Publish release (latest build of this version)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.build.outputs.version }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          # normal (pre-release degil) ve "latest": releases/latest/download/... yalniz boyle calisir
          gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" --latest \
            --title "IPCubed $TAG (beta)" \
            --notes "Install: KiCad > Plugin and Content Manager > Install from File... and pick IPCubed-pcm.zip (do not unzip it). Do not use GitHub's Code > Download ZIP. See the README."
